<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">

            <h1><span>Ottis'</span> Tac Toe</h1>
            <div class="score">
                <div class="score-you">
                    <p>You</p>
                    <p>0</p>
                </div>
                <span>Score</span>
                <div class="score-cpu">
                    <p>Boot</p>
                    <p>0</p>
                </div>
            </div>
            <div class="choix">
                <h2>Choisissez votre symbole</h2>
                <div class="buttons1">
                    <button class="x-btn">X</button>
                    <button class="o-btn">O</button>
                </div>
            </div>
            <div class="tableau">
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
                <div class="case"></div>
            </div>
            <div class="tour">
                <p>C'est le tour du Joueur <span>X</span></p>
            </div>
            <div class="buttons">
                <button class="x-btn">Nouvelle partie</button>
                <button class="o-btn">Mélanger</button>
            </div>
        </div>
    </main>
    <script src="/script.js"></script>
</body>
</html>
