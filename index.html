<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">

            <h1><span>Ottis'</span> Tac Toe</h1>
            <div class="score">
                <div class="score-you">
                    <p>You</p>
                    <p class="you-score">0</p>
                </div>
                <span>Score</span>
                <div class="score-cpu">
                    <p>Boot</p>
                    <p class="cpu-score">0</p>
                </div>
            </div>
            <div class="choix">
                <h2>Choisissez votre symbole</h2>
                <div class="buttons1">
                    <button class="x-btn">X</button>
                    <button class="o-btn">O</button>
                </div>
            </div>
            <div class="tableau">
                <div class="case" id="case0"></div>
                <div class="case" id="case1"></div>
                <div class="case" id="case2"></div>
                <div class="case" id="case3"></div>
                <div class="case" id="case4"></div>
                <div class="case" id="case5"></div>
                <div class="case" id="case6"></div>
                <div class="case" id="case7"></div>
                <div class="case" id="case8"></div>
            </div>
            <div class="tour">
                <p>C'est le tour du Joueur <div id="TourAffiche">O</div></p>
            </div>
            <div class="buttons">
                <button id="Recommencer">Recommencer</button>
                <button id="NouvellePartie">Nouvelle Partie</button>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
